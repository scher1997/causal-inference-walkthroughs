[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalsimkit"
version = "0.1.0"
description = "Transparent causal-inference estimators + a Quarto book of worked examples (DiD, SC, event studies, RDD, propensity, geo/switchback)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyterlab>=4", "ruff>=0.4"]
# Needed so `quarto render` can execute the Python cells
render = ["ipykernel", "nbformat", "nbclient", "pyyaml"]
# Mature libraries to cross-check against once a workflow is settled
production = ["statsmodels", "pyfixest", "linearmodels", "rdrobust", "rddensity", "pysyncon", "csdid", "dowhy", "econml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
